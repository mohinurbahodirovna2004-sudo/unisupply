services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: unisupply, POSTGRES_USER: unisupply, POSTGRES_PASSWORD: change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment: {POSTGRES_DB: unisupply, POSTGRES_USER: unisupply, POSTGRES_PASSWORD: change-me, POSTGRES_HOST: db, DEBUG: "0", SECRET_KEY: change-me-too}
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
